# Nav2 for A7 (stage 5), based on nav2_bringup's Humble defaults.
# Differences, and why:
# - Runs on the LIVE SLAM map: no AMCL/map_server (slam_toolbox provides
#   /map and map -> odom), frames base_footprint / odom / map.
# - Motion style (user decision after the first tests, 2026-10-15): strafing
#   slips on this floor, so NO sideways motion. RotationShimController turns
#   in place towards the path first, then DWB (differential: vx + wz only)
#   drives forward. Obstacles: the planner replans around them (1 Hz) and
#   DWB picks trajectories that keep clear.
# - Every velocity output goes to /a7/cmd_vel_nav (see a7_nav.launch.py):
#   velocity_gate is the only door to the wheels.
# - Small room: inflation 0.25 m instead of 0.55, short rolling window.
# - Speeds under velocity_gate's limits (0.25 m/s, 1.0 rad/s).
# - Collision Monitor (after the stage 5 incident, the robot pushed a
#   person): "approach" mode simulates the footprint moving with the current
#   command and slows/stops only motion that would hit something within
#   time_before_collision. Turning in place never collides, so turning away
#   always passes (user: "que no frene sino que gire").
# - Footprint: the real chassis, 22 x 18 cm (measured, arm folded), centred
#   on base_footprint, plus 1 cm padding per side.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # 20 ms in the defaults: too short on the loaded Pi, replanning requests
    # were silently dropped (stage 5 incident).
    default_server_timeout: 200
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0          # 20 in the defaults; the Pi also runs SLAM
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5       # no sideways motion (as Nav2's defaults)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    # FollowPath standing; FollowPathCrouched with the arm low (stage 6c),
    # chosen live by the behaviour tree's ControllerSelector from
    # /a7/controller_selector (published by crouch_coordinator).
    controller_plugins: ["FollowPath", "FollowPathCrouched"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      # A click on the map is a position, not a heading: any final yaw is fine.
      yaw_goal_tolerance: 3.15
    FollowPath:
      # Turn in place towards the path, then hand over to DWB.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.5       # rad (~30 deg): rotate first above this
      forward_sampling_distance: 0.4    # m along the path to measure its heading
      rotate_to_heading_angular_vel: 0.7
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0          # collision check while rotating
      # DWB (primary), differential: forward + turn, no strafing.
      debug_trajectory_details: false
      min_vel_x: 0.0                    # forward only (backing up is a recovery)
      min_vel_y: 0.0
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 0.9
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      # ObstacleFootprint, not BaseObstacle: BaseObstacle checks only the
      # cost under the robot's centre. Crouched, the arm sticks out 34 cm in
      # front, and in the first 6c demo the robot pushed it into a wardrobe
      # door the costmap did have.
      critics: ["Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.3       # steer away from cost, not only from lethal
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
    FollowPathCrouched:
      # Crouched the robot is 45 cm long with the arm in front. Same style
      # as standing (user decision): turn towards the path, then go forward;
      # slower. Reversing is NOT a driving mode: when turning would sweep
      # the arm into something, the behaviour tree backs up 15 cm to make
      # room and tries again (a7_navigate_to_pose.xml). A first version let
      # DWB reverse (PreferForward): near obstacles it dithered at ~0 m/s.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.5
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      debug_trajectory_details: false
      min_vel_x: 0.0                    # forward only: backing up is a BT recovery
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.3       # steer away from cost, not only from lethal
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.11, 0.09], [0.11, -0.09], [-0.11, -0.09], [-0.11, 0.09]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "depth_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          # Required: in Humble the per-source default is 0.0, which drops
          # every laser point (the lidar sits at z = 0.093 m). Missing this
          # left both costmaps empty and caused the stage 5 box collision.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0                   # filtered scan, as the stock Nav2 uses
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      depth_layer:
        # Stage 6b: depth camera, obstacles classified by the robot's height.
        plugin: "landerpi_nav2_depth_layer::DepthObstacleLayer"
        enabled: true
        sensor_frame: a7_depth_optical      # published by posture_manager
        base_frame: base_footprint
        input: image                        # processes the camera, publishes the clouds
        crouchable_cost: by_posture         # blocks a standing robot, free crouched
        odom_frame: odom
        rate_hz: 5.0
        stride: 4
        # Floor in the cloud: one point per 2.5 cm. At the costmap's own 5 cm,
        # the global grid (rotated against the robot) had cells that never
        # got a floor point, so wrong marks there were never cleared.
        cloud_floor_cell: 0.025
        min_range: 0.25
        max_range: 3.0
        floor_band: 0.015
        crouch_height: 0.20                 # arm low, measured (stage 6c)
        crouch_margin: 0.02
        stand_height: 0.33                  # arm high, measured (stage 6c)
        stand_margin: 0.05                  # bed edge at the top of the image, noisy
        obstacle_max_range: 2.5
        default_robot_height: 0.33
        body_x_min: -0.13
        body_x_max: 0.13
        body_half_width: 0.11
      inflation_layer:
        # Avoid by steering, not braking (user request, 6c): a gentler,
        # wider cost slope makes DWB prefer trajectories away from obstacles.
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.11, 0.09], [0.11, -0.09], [-0.11, -0.09], [-0.11, 0.09]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "depth_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          # Required: in Humble the per-source default is 0.0, which drops
          # every laser point (the lidar sits at z = 0.093 m). Missing this
          # left both costmaps empty and caused the stage 5 box collision.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      depth_layer:
        # Stage 6b: the frames the local costmap's depth layer already
        # classified (/a7/depth_obstacles), not the image again. With its
        # own sparser pass (1 Hz, 1 px in 8) the bed edge had gaps the
        # planner kept routing through (third 6b test).
        plugin: "landerpi_nav2_depth_layer::DepthObstacleLayer"
        enabled: true
        input: cloud                        # /a7/depth_frame from the local layer
        crouchable_cost: free               # plan under beds; the robot crouches on the way
        publish_crouch_cells: true          # /a7/crouch_cells for crouch_coordinator
        base_frame: base_footprint
        odom_frame: odom
        rate_hz: 2.0
      inflation_layer:
        # Wider and gentler than the defaults: planned paths bend around
        # obstacles from further away instead of grazing them, so the
        # Collision Monitor rarely has to brake (user request, 6c). Beyond
        # the robot's own radius inflation only costs, it never blocks, so
        # doorways stay passable.
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true                # may plan into just-discovered space

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 0.9]      # no sideways motion
    min_velocity: [-0.10, 0.0, -0.9]    # small reverse only for the back-up recovery
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/a7/nav/cmd_vel_checked"   # smoother + behaviours
    cmd_vel_out_topic: "/a7/cmd_vel_nav"          # -> velocity_gate
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # s of free motion required. 2.0 braked well before DWB could steer
      # around; 1.2 once touched a box, but then the costmaps were empty (the
      # max_obstacle_height bug), so the planner did not avoid it at all.
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 2                   # 3+ laser points in the way trigger it
      visualize: false
    observation_sources: ["scan", "depth"]
    scan:
      type: "scan"
      topic: "/scan"
    # Stage 6b: obstacles the lidar cannot see (low, or hanging), already
    # filtered by the robot's height by the depth layer, at z = 0.1 m.
    depth:
      type: "pointcloud"
      topic: "/a7/depth_obstacles"
      min_height: 0.05
      max_height: 0.5
