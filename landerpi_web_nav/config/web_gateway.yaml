# Read-only web gateway (stage 3). Same names as declare_parameter in
# web_gateway_node.cpp.
web_gateway:
  ros__parameters:
    address: 0.0.0.0          # IPv4 only: the robot's public IPv6 is never used
    port: 8000
    # Home only: anything else gets 403 before the password is looked at.
    allowed_networks: ["192.168.100.0/24", "192.168.149.0/24", "127.0.0.1"]
    password_file: ~/.a7/password   # written by a7_set_password (hash only)
    # Built web app, copied from the PC to /home/pi/docker/tmp/a7_web on the host.
    static_root: /home/ubuntu/shared/a7_web
    token_ttl_s: 43200        # 12 h
    max_login_failures: 5     # per IP, per minute
    pose_rate_hz: 10.0
    scan_rate_hz: 5.0
    status_rate_hz: 1.0
    scan_stride: 2            # every 2nd beam: ~250 points per scan
    map_frame: map
    base_frame: base_footprint
