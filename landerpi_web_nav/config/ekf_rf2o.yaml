# Stage 1 candidate: EKF over the covariance_stamper outputs.
# - rf2o pose, fused differentially (x, y, yaw deltas -> velocities): rf2o's
#   own twist has no vy, its pose does follow lateral motion.
# - odom_raw velocities with slip-aware covariances.
# - IMU gyro (yaw rate) only: its absolute yaw drifts without magnetometer.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /a7/odom_rf2o
    # [x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az]
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: true
    odom0_queue_size: 5

    odom1: /a7/odom_raw
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 5

    imu0: /a7/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
