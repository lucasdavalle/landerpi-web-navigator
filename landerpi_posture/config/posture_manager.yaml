# Arm postures for navigation (stage 6), measured on the robot 2026-10-15.
# pulses: servos 1..5 (base, shoulder, elbow, wrist pitch, wrist roll); the
# gripper (id 10) is never commanded (its servo is burned).
# Footprint: front / back / half_width in base_footprint (m).
# cam_*: fallback camera calibration (floor fit), radians for angles.
posture_manager:
  ros__parameters:
    move_duration: 3.0          # s, slow on purpose
    settle: 0.7                 # s after the move before calibrating
    calibration_timeout: 2.0    # s waiting for a depth image
    postures:
      high:
        # Camera = highest point, looking ahead and down: 33 cm tall (tape).
        # Wrist at 125, not 10 (stage 6c): at 25 deg down the top of the image
        # was below the horizon and the camera never saw anything higher than
        # itself, so a bed edge (30 cm) went unseen. At 12 deg down it sees up
        # to 13 deg above the horizon. Below ~50 the wrist does not move.
        pulses: [500, 670, 310, 125, 500]
        height: 0.33
        front: 0.11
        back: -0.11
        half_width: 0.09
        cam_height: 0.304       # floor fit 2026-10-16: 30.4 cm, pitch 12.2 deg
        cam_pitch: 0.213
        cam_roll: 0.049
        calibrated: true
      low:
        # Arm forward and horizontal, camera looking ahead. Sticks out 23 cm in
        # front.
        pulses: [500, 160, 500, 500, 500]
        height: 0.20            # highest point, measured with a tape (stage 6c)
        front: 0.34
        back: -0.11
        half_width: 0.09
        cam_height: 0.198       # floor fit 2026-10-15: 19.8 cm, pitch 4.6 deg, roll 5.5 deg
        cam_pitch: 0.080
        cam_roll: 0.096
        calibrated: true
    # Stage 6c: before standing up, turn the camera up and look. Pose found by
    # the user with arm_teleop (19 cm: lower than the low posture, so the check
    # itself cannot hit what it is checking for). Measured with it: under the
    # bed 69 % readings, 98 % of them nearer than 0.5 m; open room 60 %, none.
    look_up:
      pulses: [500, 100, 260, 980, 500]
      near_distance: 0.5        # m
      min_valid_fraction: 0.3   # fewer readings: unknown, stay crouched
      max_near_fraction: 0.05   # more near readings: blocked, stay crouched
